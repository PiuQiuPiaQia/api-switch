name: Beta Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Core changes in this beta
        required: false
        default: 首个 VV Code Beta 版本，包含核心功能和最新修复。
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Universal
            os: macos-14
            artifact: VV-Code-beta-macOS
          - label: Windows x64
            os: windows-2022
            artifact: VV-Code-beta-Windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for required in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required macOS release secret: $required" >&2
              exit 1
            fi
          done

          cert_path="$RUNNER_TEMP/vv-code-beta-certificate.p12"
          keychain_path="$RUNNER_TEMP/vv-code-beta.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" \
            | (base64 --decode 2>/dev/null || base64 -D) > "$cert_path"

          original_keychain=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_keychain" >> "$GITHUB_ENV"
          echo "VV_CODE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"

          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | grep 'Developer ID Application' \
            | grep -oE '"[^"]+"' \
            | head -1 \
            | tr -d '"')
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found." >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$cert_path"

      - name: Build macOS package
        if: runner.os == 'macOS'
        timeout-minutes: 60
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package:beta -- --target universal-apple-darwin

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: pnpm package:beta

      - name: Collect macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beta-artifacts
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path=$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)

          test -n "$app_path"
          test -n "$dmg_path"

          bundle_id=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")
          display_name=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist")
          executable=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          category=$(/usr/libexec/PlistBuddy \
            -c 'Print :LSApplicationCategoryType' "$app_path/Contents/Info.plist")

          test "$bundle_id" = 'com.vvcode.desktop'
          test "$display_name" = 'VV Code'
          test "$executable" = 'vv-code'
          test "$category" = 'public.app-category.developer-tools'

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_info=$(codesign -dv --verbose=4 "$app_path" 2>&1)
          echo "$signing_info" | grep -q 'Authority=Developer ID Application:'
          echo "$signing_info" | grep -q 'Identifier=com.vvcode.desktop'
          if echo "$signing_info" | grep -q 'Signature=adhoc'; then
            echo 'Refusing to publish an ad-hoc signed macOS beta.' >&2
            exit 1
          fi
          spctl -a -t exec -vv "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          spctl -a -t open --context context:primary-signature -vv "$dmg_path"
          xcrun stapler validate "$dmg_path"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" beta-artifacts/VV-Code-beta-macOS.app.zip
          cp "$dmg_path" beta-artifacts/VV-Code-beta-macOS.dmg

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${VV_CODE_KEYCHAIN_PATH:-}" ] && [ -f "$VV_CODE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$VV_CODE_KEYCHAIN_PATH" || true
          fi

      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path beta-artifacts | Out-Null
          $bundleRoot = 'src-tauri/target/release/bundle'
          $msi = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.exe | Select-Object -First 1

          if ($null -eq $msi) { throw 'Windows MSI was not generated.' }
          if ($null -eq $nsis) { throw 'Windows installer was not generated.' }

          Copy-Item $msi.FullName beta-artifacts/VV-Code-beta-Windows-x64.msi
          Copy-Item $nsis.FullName beta-artifacts/VV-Code-beta-Windows-x64-setup.exe

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: beta-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Beta Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: VV-Code-beta-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tag="v${version}-beta.${GITHUB_RUN_NUMBER}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          test -f release-assets/VV-Code-beta-macOS.dmg
          test -f release-assets/VV-Code-beta-macOS.app.zip
          test -f release-assets/VV-Code-beta-Windows-x64.msi
          test -f release-assets/VV-Code-beta-Windows-x64-setup.exe

          mkdir -p publish-assets
          cp release-assets/VV-Code-beta-macOS.dmg \
            "publish-assets/VV-Code-${tag}-macOS.dmg"
          cp release-assets/VV-Code-beta-macOS.app.zip \
            "publish-assets/VV-Code-${tag}-macOS.app.zip"
          cp release-assets/VV-Code-beta-Windows-x64.msi \
            "publish-assets/VV-Code-${tag}-Windows-x64.msi"
          cp release-assets/VV-Code-beta-Windows-x64-setup.exe \
            "publish-assets/VV-Code-${tag}-Windows-x64-setup.exe"

          (
            cd publish-assets
            sha256sum VV-Code-* > SHA256SUMS.txt
          )

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VV Code ${{ steps.release.outputs.tag }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## 更新内容

            ${{ inputs.notes }}

            ## 下载

            - macOS：`.dmg` 或 `.app.zip`
            - Windows：`setup.exe` 或 `.msi`

            > macOS Beta 安装包已通过 Developer ID 签名与 Apple 公证；Windows Beta 安装包暂未签名，可能出现 SmartScreen 提示。

            基于 [CC Switch](https://github.com/farion1231/cc-switch) 开发，遵循 MIT License。
          files: publish-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add release link
        shell: bash
        run: |
          echo "[VV Code ${{ steps.release.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
