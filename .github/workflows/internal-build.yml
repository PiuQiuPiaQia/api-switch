name: Internal desktop build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} internal package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-14
            artifact: VV-Code-internal-macOS
          - label: Windows x64
            os: windows-2022
            artifact: VV-Code-internal-Windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS' && inputs.target != 'windows'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS internal package
        if: runner.os == 'macOS' && inputs.target != 'windows'
        run: pnpm package:internal -- --target universal-apple-darwin

      - name: Build Windows internal package
        if: runner.os == 'Windows' && inputs.target != 'macos'
        run: pnpm package:internal

      - name: Collect and verify macOS artifacts
        if: runner.os == 'macOS' && inputs.target != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal-artifacts
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path=$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          dmg_path=$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -type f | head -1)

          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" internal-artifacts/VV-Code-internal-macOS.app.zip
          cp "$dmg_path" internal-artifacts/VV-Code-internal-macOS.dmg

      - name: Collect Windows artifacts
        if: runner.os == 'Windows' && inputs.target != 'macos'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path internal-artifacts | Out-Null
          $bundleRoot = 'src-tauri/target/release/bundle'
          $msi = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem -Path $bundleRoot -Recurse -Filter *.exe | Select-Object -First 1

          if ($null -eq $msi) { throw 'Windows MSI artifact was not generated.' }
          if ($null -eq $nsis) { throw 'Windows NSIS artifact was not generated.' }

          Copy-Item $msi.FullName internal-artifacts/VV-Code-internal-Windows-x64.msi
          Copy-Item $nsis.FullName internal-artifacts/VV-Code-internal-Windows-x64-setup.exe

      - name: Upload internal packages
        if: >-
          (runner.os == 'macOS' && inputs.target != 'windows') ||
          (runner.os == 'Windows' && inputs.target != 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: internal-artifacts/*
          if-no-files-found: error
          retention-days: 14
